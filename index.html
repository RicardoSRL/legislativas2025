<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionário Político</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0 auto; padding: 2rem; color: #333; max-width: 650px; }
    .question { margin-bottom: 2rem; background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .options label { margin-right: 1rem; }
    .weight { display: flex; align-items: center; margin-top: 0.5rem; }
    .results { margin-top: 3rem; max-width: 400px;}
    canvas { background: white; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Questionário Político</h1>
  <form id="quizForm"></form>
  <button onclick="calculateResults()">Calcular Resultados</button>
  <div class="results">
    <canvas id="resultsChart" width="400" height="400"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const questions = [
        { text: "O salário mínimo deve ser aumentado substancialmente para garantir padrões de vida dignos, mesmo com impacto nos empregadores?", options: ["Sim, é uma questão de justiça social.", "Deve haver equilíbrio entre dignidade e viabilidade económica.", "Não, as empresas já enfrentam demasiados encargos."] },
        { text: "Portugal deve abandonar a NATO e seguir uma política de neutralidade internacional?", options: ["Sim, devemos adotar uma política de paz e neutralidade.", "Manter a NATO, mas com voz mais crítica.", "Não, a nossa segurança depende da NATO."] },
        { text: "O Estado deve renacionalizar setores como a energia, banca e transportes?", options: ["Sim, são áreas estratégicas para a soberania.", "Só se houver falha comprovada do setor privado.", "Não, a gestão privada é mais eficaz."] },
        { text: "A eutanásia deve ser legalizada em Portugal?", options: ["Sim, respeitar a autonomia individual é essencial.", "Sim, mas com forte regulação.", "Não, é contrária aos valores éticos."] },
        { text: "O ensino superior deve ser completamente gratuito para todos?", options: ["Sim, como parte do direito à educação.", "Gratuito apenas para quem comprovar necessidade.", "Não, deve haver propinas moderadas."] },
        { text: "Devem existir quotas obrigatórias para mulheres em cargos de liderança empresarial?", options: ["Sim, para corrigir desigualdades históricas.", "Devem ser metas recomendadas, não imposições.", "Não, a seleção deve ser apenas por mérito."] },
        { text: "Portugal deve reconhecer oficialmente o Estado da Palestina?", options: ["Sim, é uma questão de direitos humanos.", "Sim, mas em alinhamento com a UE.", "Não, devemos manter neutralidade."] },
        { text: "Deve ser criado um imposto sobre grandes fortunas (acima de 5 milhões de euros)?", options: ["Sim, para promover justiça social.", "Sim, mas com medidas contra evasão fiscal.", "Não, desincentiva o investimento."] },
        { text: "A cannabis deve ser legalizada para fins recreativos?", options: ["Sim, com regulação semelhante ao álcool.", "Sim, mas com controlo apertado e campanhas de sensibilização.", "Não, poderá agravar problemas sociais."] },
        { text: "Portugal deve permanecer na União Europeia mesmo que enfrente restrições orçamentais?", options: ["Sim, os benefícios superam os custos.", "Sim, mas exigindo mais flexibilidade.", "Não, a soberania económica deve prevalecer."] },
        { text: "A carga fiscal sobre os rendimentos mais altos deve aumentar?", options: ["Sim, é necessário maior redistribuição.", "Apenas se houver desequilíbrio comprovado.", "Não, penaliza o mérito."] },
        { text: "O investimento em energias renováveis deve ser uma prioridade absoluta?", options: ["Sim, mesmo com custos iniciais elevados.", "Sim, mas sem descuidar a viabilidade económica.", "Não, deve haver equilíbrio com outras fontes."] },
        { text: "O SNS deve ser o principal prestador de cuidados de saúde, excluindo soluções privadas?", options: ["Sim, a saúde deve ser 100% pública.", "Sim, mas permitindo complementaridade com o setor privado.", "Não, o privado pode gerir melhor certos serviços."] },
        { text: "A imigração deve ser facilitada como forma de combater o envelhecimento da população?", options: ["Sim, é essencial para o crescimento.", "Sim, mas com critérios bem definidos.", "Não, devemos priorizar os nacionais."] },
        { text: "A habitação pública deve ser fortemente reforçada nas zonas urbanas?", options: ["Sim, é urgente garantir acesso à habitação.", "Sim, mas em colaboração com o setor privado.", "Não, o mercado deve regular a oferta."] },
        { text: "Deve ser criado um rendimento básico incondicional?", options: ["Sim, é uma forma de garantir dignidade a todos.", "Talvez, mediante estudos de viabilidade.", "Não, desincentiva o trabalho."] },
        { text: "As touradas devem ser totalmente proibidas em Portugal?", options: ["Sim, são uma prática cruel e antiquada.", "Sim, exceto se culturalmente justificadas.", "Não, fazem parte da identidade cultural."] },
        { text: "Os estudantes do ensino superior devem ter acesso gratuito aos transportes públicos?", options: ["Sim, para incentivar o ensino e a mobilidade sustentável.", "Sim, mas condicionado ao rendimento.", "Não, deve haver apenas desconto moderado."] },
        { text: "A carga horária de trabalho deve ser reduzida para 35 horas semanais sem perda salarial?", options: ["Sim, é possível com reorganização da produtividade.", "Sim, mas gradualmente.", "Não, seria insustentável para as empresas."] },
        { text: "As prisões devem ter foco prioritário na reinserção social?", options: ["Sim, punir sem reabilitar não resolve.", "Sim, mas com exigência de responsabilidade.", "Não, o foco deve ser na punição."] },
        { text: "Portugal deve adotar o voto obrigatório nas eleições?", options: ["Sim, aumenta a participação democrática.", "Talvez, mas com penalizações simbólicas.", "Não, o voto deve ser um direito, não uma obrigação."] },
        { text: "Os trabalhadores independentes devem ter mais proteção social, mesmo que isso implique contribuições mais altas?", options: ["Sim, é uma questão de justiça.", "Sim, mas com equilíbrio nas contribuições.", "Não, deve manter-se a liberdade de escolha."] },
        { text: "O sistema de ensino deve incluir educação política obrigatória?", options: ["Sim, para formar cidadãos mais informados.", "Talvez, mas sem enviesamento ideológico.", "Não, deve ser opcional ou extracurricular."] },
        { text: "As grandes plataformas tecnológicas devem ser taxadas especificamente em Portugal?", options: ["Sim, para combater a evasão fiscal internacional.", "Sim, mas dentro de um esforço europeu.", "Não, podem desincentivar o investimento."] },
        { text: "Portugal deve adotar uma política de tolerância zero à corrupção com penas mais severas?", options: ["Sim, é essencial restaurar a confiança nas instituições.", "Sim, mas com foco em prevenção.", "Não, o sistema atual é suficiente."] },
        { text: "Deve existir uma limitação de mandatos para deputados?", options: ["Sim, evita o carreirismo político.", "Sim, mas com um número razoável de mandatos.", "Não, deve prevalecer a vontade dos eleitores."] },
        { text: "A regionalização administrativa deve avançar em Portugal?", options: ["Sim, para maior proximidade com os cidadãos.", "Sim, mas com cautela e estudos prévios.", "Não, pode criar desigualdades e ineficiências."] },
        { text: "O Estado deve investir mais na cultura, mesmo em tempos de crise?", options: ["Sim, a cultura é essencial para a identidade.", "Sim, mas com prioridades definidas.", "Não, há áreas mais urgentes."] },
        { text: "As empresas devem ser obrigadas a divulgar publicamente os salários por género?", options: ["Sim, para promover a transparência.", "Sim, mas com proteção de dados.", "Não, pode criar tensões internas desnecessárias."] },
        { text: "Portugal deve banir completamente os combustíveis fósseis até 2040?", options: ["Sim, por razões ambientais urgentes.", "Sim, mas com planeamento gradual.", "Não, é uma meta irrealista."] },
        { text: "Deve haver mais incentivos ao teletrabalho permanente?", options: ["Sim, é mais sustentável e flexível.", "Sim, mas depende da área profissional.", "Não, compromete a dinâmica empresarial."] },
        { text: "O ensino privado deve continuar a receber apoios estatais?", options: ["Não, o Estado deve apoiar apenas o ensino público.", "Sim, se colmatar falhas locais do público.", "Sim, todos devem poder escolher com apoio."] },
        { text: "Portugal deve adotar uma taxa turística nacional?", options: ["Sim, para ajudar a preservar património.", "Sim, mas só em regiões com muita procura.", "Não, pode afastar turistas."] },
        { text: "Deve ser legalizado o voto eletrónico remoto?", options: ["Sim, para facilitar a participação.", "Sim, mas apenas com segurança garantida.", "Não, é vulnerável a fraudes."] },
        { text: "Os lobbies devem ser regulados e registados obrigatoriamente?", options: ["Sim, por transparência e ética.", "Sim, mas com fiscalização clara.", "Não, pode limitar a liberdade de expressão."] },
        { text: "Portugal deve criar um ministério exclusivo para a transição climática?", options: ["Sim, é um tema transversal e urgente.", "Sim, se não criar duplicações.", "Não, já existem estruturas suficientes."] },
        { text: "A internet de banda larga deve ser considerada um serviço básico garantido a todos?", options: ["Sim, como a água e eletricidade.", "Sim, mas só em zonas carenciadas.", "Não, não é função do Estado."] },
        { text: "Portugal deve reduzir o número de deputados na Assembleia da República?", options: ["Sim, para maior eficiência.", "Sim, mas sem afetar a representatividade.", "Não, isso reduziria a diversidade democrática."] },
        { text: "Os subsídios agrícolas devem privilegiar práticas sustentáveis?", options: ["Sim, para proteger o ambiente.", "Sim, mas sem prejudicar a produção.", "Não, devem ser distribuídos equitativamente."] },
        { text: "Portugal deve sair do euro e recuperar a sua moeda?", options: ["Sim, para recuperar autonomia monetária.", "Talvez, se comprovadas vantagens.", "Não, o euro traz estabilidade."] }
    
        ];

        const partyPositions = {
            "BE":     ["a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","b","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a"],
            "PCP":    ["a","a","a","b","a","b","a","a","b","b","a","a","a","b","a","a","b","a","a","b","a","a","a","a","a","a","a","b","a","a","a","a","a","a","a","a","b","a","a","b"],
            "PS":     ["b","b","b","b","b","a","b","b","b","a","b","b","a","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b"],
            "IL":     ["c","c","c","a","c","c","b","c","a","a","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c"],
            "CH":     ["c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c","c"],
            "PSD":    ["b","c","b","b","b","b","b","c","b","a","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b","b"],
            "PAN":    ["a","b","a","a","a","a","a","b","a","b","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a"],
            "LIVRE":  ["a","b","a","a","a","a","a","a","a","b","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a","a"]
            };

    const form = document.getElementById("quizForm");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<p><strong>${i+1}. ${q.text}</strong></p>`;
      const opts = ["a", "b", "c"];
      q.options.forEach((opt, j) => {
        div.innerHTML += `<label><input type="radio" name="q${i}" value="${opts[j]}"> ${opt}</label></br>`;
      });
      div.innerHTML += `<div class='weight'>Importância: <input type='range' name='w${i}' min='1' max='5' value='3'></div>`;
      form.appendChild(div);
    });

    function calculateResults() {
      const scores = {};
      Object.keys(partyPositions).forEach(p => scores[p] = 0);

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        const weight = parseInt(document.querySelector(`input[name='w${i}']`).value);
        if (!selected) return;
        const answer = selected.value;

        for (const party in partyPositions) {
          if (partyPositions[party][i] === answer) {
            scores[party] += weight;
          }
        }
      });

      renderChart(scores);
    }

    function renderChart(scores) {
      const ctx = document.getElementById("resultsChart").getContext("2d");
      const data = {
        labels: Object.keys(scores),
        datasets: [{
          label: "Compatibilidade",
          data: Object.values(scores),
          backgroundColor: "rgba(75, 192, 192, 0.2)",
          borderColor: "rgba(75, 192, 192, 1)",
          borderWidth: 2
        }]
      };

      new Chart(ctx, {
        type: "radar",
        data: data,
        options: {
          responsive: true,
          scales: {
            r: {
              beginAtZero: true,
              max: Math.max(...Object.values(scores)) + 5
            }
          }
        }
      });
    }
  </script>
</body>
</html>
